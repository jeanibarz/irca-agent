:root {

@media (prefers-color-scheme: dark) {

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    color: var(--text);
    line-height: 1.6;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

header {
    text-align: center;
    margin-bottom: 2rem;
}

header h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
}

.timestamp {
    color: var(--text-muted);
    font-size: 0.875rem;
}

/* Cards */
.card {
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
}

.card-header h2 {
    font-size: 1.125rem;
    font-weight: 600;
}

.card-header .icon {
    font-size: 1.25rem;
}

/* Summary Card */
.summary-card {
    background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
    border: 1px solid var(--primary);
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.summary-item {
    text-align: center;
    padding: 1rem;
    background: var(--bg);
    border-radius: var(--radius);
}

.summary-item .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
}

.summary-item .value {
    font-size: 1.5rem;
    font-weight: 700;
}

.summary-item .delta {
    font-size: 0.875rem;
    margin-top: 0.25rem;
}

.delta.positive { color: var(--secondary); }
.delta.negative { color: var(--danger); }
.delta.neutral { color: var(--text-muted); }

/* Tables */
.metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
}

.metrics-table th,
.metrics-table td {
    padding: 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
}

.metrics-table th {
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.metrics-table td.numeric {
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
    text-align: right;
}

.metrics-table tr:last-child td {
    border-bottom: none;
}

/* Charts */
.chart-container {
    position: relative;
    height: 300px;
    margin: 1rem 0;
}

.chart-container.small {
    height: 200px;
}

/* Grid layout */
.two-column {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 1.5rem;
}

/* Status badges */
.badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 9999px;
}

.badge.success {
    background: var(--secondary-light);
    color: var(--secondary);
}

.badge.warning {
    background: rgba(245, 158, 11, 0.1);
    color: var(--warning);
}

.badge.info {
    background: var(--primary-light);
    color: var(--primary);
}

/* Collapsible sections */
.collapsible-header {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.collapsible-header::before {
    content: '\25BC';
    font-size: 0.75rem;
    transition: transform 0.2s;
}

.collapsible-header.collapsed::before {
    transform: rotate(-90deg);
}

.collapsible-content {
    overflow: hidden;
    transition: max-height 0.3s ease;
}

.collapsible-content.collapsed {
    max-height: 0 !important;
}

/* Interpretation box */
.interpretation {
    background: var(--bg-alt);
    border-left: 4px solid var(--primary);
    padding: 1rem;
    margin-top: 1rem;
    border-radius: 0 var(--radius) var(--radius) 0;
}

.interpretation p {
    margin: 0;
    font-size: 0.875rem;
}

/* Footer */
footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.875rem;
}

/* Responsive */
@media (max-width: 768px) {
    .container {
        padding: 1rem;
    }

    .two-column {
        grid-template-columns: 1fr;
    }

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }
}

/* Print styles */
@media print {
    body {
        background: white;
    }

    .container {
        max-width: none;
        padding: 0;
    }

    .card {
        break-inside: avoid;
        box-shadow: none;
        border: 1px solid var(--border);
    }
}

// Utility functions
function formatNumber(n, decimals = 2) {
    if (n === null || n === undefined) return 'N/A';
    if (typeof n !== 'number') return n;
    return n.toLocaleString(undefined, {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals

}

function formatPercentage(n) {
    if (n === null || n === undefined) return 'N/A';
    return (n * 100).toFixed(1) + '%';
}

function formatDelta(value) {
    if (!value || typeof value !== 'string') return '';
    const isPositive = value.startsWith('+');
    const isNegative = value.startsWith('-');
    const className = isPositive ? 'positive' : isNegative ? 'negative' : 'neutral';
    return `<span class="delta ${className}">${value}</span>`;
}

    if (!contributions || Object.keys(contributions).length === 0) return '';

    return `
        <div class="card">
            <div class="card-header">
                <span class="icon">🔧</span>
                <h2>Augmentation Contribution</h2>
            </div>
            <div class="chart-container">
                <canvas id="augmentation-chart"></canvas>
            </div>
            <table class="metrics-table">
                <thead>
                    <tr>
                        <th>Augmentation Type</th>
                        <th>Sample Count</th>
                        <th>Mean Perplexity</th>
                    </tr>
                </thead>
                <tbody>
                    ${Object.entries(contributions).map(([type, stats]) => `
                        <tr>
                            <td>${escapeHtml(type)}</td>
                            <td class="numeric">${formatNumber(stats.sample_count, 0)}</td>
                            <td class="numeric">${formatNumber(stats.mean_perplexity)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function renderMetadata(data) {
    const meta = data.metadata || {};
    return `
        <div class="card">
            <div class="card-header collapsible-header" onclick="toggleCollapsible(this)">
                <span class="icon">ℹ️</span>
                <h2>Report Metadata</h2>
            </div>
            <div class="collapsible-content">
                <table class="metrics-table">
                    <tbody>
                        <tr><td>Generated</td><td>${data.generated_at || 'Unknown'}</td></tr>
                        ${meta.git_commit ? `<tr><td>Git Commit</td><td>${escapeHtml(meta.git_commit)}</td></tr>` : ''}
                        ${meta.git_branch ? `<tr><td>Git Branch</td><td>${escapeHtml(meta.git_branch)}</td></tr>` : ''}
                        ${meta.irca_version ? `<tr><td>IRCA Version</td><td>${escapeHtml(meta.irca_version)}</td></tr>` : ''}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function getPerplexityInterpretation(origPpl, augPpl) {
    if (!origPpl || !augPpl) return 'Insufficient data for interpretation.';

    const change = (augPpl - origPpl) / origPpl;

    if (change > 0.10) {
        return 'Augmented dataset is significantly more challenging for the model (>10% perplexity increase). This indicates good diversity gain and should improve training robustness.';
    } else if (change > 0.02) {
        return 'Augmented dataset is moderately more challenging (2-10% increase). Some diversity gain detected. Consider stronger augmentation for better results.';
    } else if (change > -0.02) {
        return 'Augmented dataset has similar perplexity to original. Augmentation may not be adding significant diversity. Consider different augmentation strategies.';
    } else {
        return 'Augmented dataset has lower perplexity than original. This is unusual and may indicate the augmentation is making the data more predictable/repetitive.';
    }
}

function toggleCollapsible(header) {
    header.classList.toggle('collapsed');
    const content = header.nextElementSibling;
    content.classList.toggle('collapsed');
}

// Chart rendering
function renderCharts(data) {
    // Distinct-n chart
    const distinctCtx = document.getElementById('distinct-n-chart');
    if (distinctCtx) {
        if (data.comparison_mode) {
            const orig = data.original?.lexical || {};
            const aug = data.augmented?.lexical || {};
            new Chart(distinctCtx, {
                type: 'bar',
                data: {
                    labels: ['Distinct-1', 'Distinct-2', 'Distinct-3'],
                    datasets: [
                        {
                            label: 'Original',
                            data: [orig.distinct_1, orig.distinct_2, orig.distinct_3],
                            backgroundColor: colors.primaryLight,
                            borderColor: colors.primary,
                            borderWidth: 2,
                        },
                        {
                            label: 'Augmented',
                            data: [aug.distinct_1, aug.distinct_2, aug.distinct_3],
                            backgroundColor: colors.secondaryLight,
                            borderColor: colors.secondary,
                            borderWidth: 2,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 1,
                            title: { display: true, text: 'Ratio' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(4) || 'N/A'}`
                            }
                        }
                    }
                }
            });
        } else {
            const lex = data.dataset?.lexical || {};
            new Chart(distinctCtx, {
                type: 'bar',
                data: {
                    labels: ['Distinct-1', 'Distinct-2', 'Distinct-3'],
                    datasets: [{
                        label: 'Value',
                        data: [lex.distinct_1, lex.distinct_2, lex.distinct_3],
                        backgroundColor: colors.primaryLight,
                        borderColor: colors.primary,
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 1 }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    }

    // Perplexity comparison chart
    const pplCtx = document.getElementById('perplexity-chart');
    if (pplCtx && data.comparison_mode) {
        const origPpl = data.original?.perplexity || {};
        const augPpl = data.augmented?.perplexity || {};

        new Chart(pplCtx, {
            type: 'bar',
            data: {
                labels: ['Mean', 'Median', 'P90', 'P95', 'Std Dev'],
                datasets: [
                    {
                        label: 'Original',
                        data: [
                            origPpl.mean_perplexity,
                            origPpl.median_perplexity,
                            origPpl.p90_perplexity,
                            origPpl.p95_perplexity,
                            origPpl.std_perplexity
                        ],
                        backgroundColor: colors.primaryLight,
                        borderColor: colors.primary,
                        borderWidth: 2,
                    },
                    {
                        label: 'Augmented',
                        data: [
                            augPpl.mean_perplexity,
                            augPpl.median_perplexity,
                            augPpl.p90_perplexity,
                            augPpl.p95_perplexity,
                            augPpl.std_perplexity
                        ],
                        backgroundColor: colors.secondaryLight,
                        borderColor: colors.secondary,
                        borderWidth: 2,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Perplexity' }
                    }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2) || 'N/A'}`
                        }
                    }
                }
            }
        });
    }

    // Augmentation contribution chart
    const augCtx = document.getElementById('augmentation-chart');
    if (augCtx && data.augmentation_contributions) {
        const contributions = data.augmentation_contributions;
        const labels = Object.keys(contributions);
        const values = labels.map(k => contributions[k].mean_perplexity);

        // Sort by perplexity (descending)
        const sorted = labels.map((l, i) => ({ label: l, value: values[i] }))
            .sort((a, b) => b.value - a.value);

        new Chart(augCtx, {
            type: 'bar',
            data: {
                labels: sorted.map(s => s.label),
                datasets: [{
                    label: 'Mean Perplexity',
                    data: sorted.map(s => s.value),
                    backgroundColor: sorted.map(s =>
                        s.label === 'baseline' ? colors.gray : colors.warning
                    ),
                    borderColor: sorted.map(s =>
                        s.label === 'baseline' ? colors.gray : colors.warning
                    ),
                    borderWidth: 1,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true,
                        title: { display: true, text: 'Mean Perplexity' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `Mean PPL: ${ctx.parsed.x?.toFixed(2) || 'N/A'}`
                        }
                    }
                }
            }
        });
    }
}

// Main render function
function render() {
    const container = document.getElementById('report-content');

    // Update timestamp
    const timeEl = document.getElementById('generated-time');
    if (timeEl && reportData.generated_at) {
        timeEl.textContent = new Date(reportData.generated_at).toLocaleString();
    }

    // Build HTML
    let html = '';
    html += renderSummaryCard(reportData);

    html += '<div class="two-column">';
    html += renderLexicalSection(reportData);
    html += renderSemanticSection(reportData);
    html += '</div>';

    html += renderPerplexitySection(reportData);
    html += renderAugmentationBreakdown(reportData);
    html += renderMetadata(reportData);

    container.innerHTML = html;

    // Render charts after DOM is updated
    setTimeout(() => renderCharts(reportData), 0);
}

// Initialize
document.addEventListener('DOMContentLoaded', render);

    </script>
</body>
</html>
